<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0B4F6C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Skylike</title>
<link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Nunito";src:url("fonts/nunito-latin-wght-normal.woff2") format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}
:root{
  --ground:#E8EFF1; --surface:#F8FBFC; --raise:#FFFFFF; --sand:#E9DDC8; --sand-ink:#5E4B2E;
  --ink:#10293A; --ink-2:#46606F; --ink-3:#6B8290; --line:rgba(0,0,0,.10);
  --pick:#126C8F; --ocean:#0B4F6C; --ocean-2:#126C8F; --ocean-ink:#E6F2F7; --ocean-ink-2:#9CC3D3;
  --apricot:#F2A65A; --apricot-ink:#7A4210;
  --ok:#3E8A63; --warn:#C98A12; --bad:#C24A3A;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px -14px rgba(0,0,0,.22);
  --radius:22px; --radius-s:14px;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rail:92px; --pad:22px;
  color-scheme:light;
}
body.night{
  --pick:#2F7FA6;
  --ground:#0C1424; --surface:#121C30; --raise:#17233B; --sand:#2A2A35; --sand-ink:#CDBF9F;
  --ink:#B9C6D6; --ink-2:#8697AB; --ink-3:#66778C; --line:rgba(185,198,214,.10);
  --ocean:#08101E; --ocean-2:#13233D; --ocean-ink:#AFC0D2; --ocean-ink-2:#6E8199;
  --apricot:#C98B52; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-feature-settings:"tnum" 0;background:var(--ground);color:var(--ink);font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;transition:background .6s ease,color .6s ease}
::selection{background:color-mix(in srgb,var(--apricot) 45%,transparent);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ocean-2);outline-offset:2px;border-radius:10px}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr;height:100dvh;height:100vh}
@supports(height:100dvh){#app{height:100dvh}}
#app{height:var(--app-h,100dvh)}
.rail{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--ocean);color:var(--ocean-ink);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));gap:8px;transition:background .6s}
.faces{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid rgba(230,242,247,.14)}
.face{width:56px;height:56px;border-radius:50%;border:3px solid transparent;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;background:var(--c,#2F7BB5);transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s}
.face.on{border-color:var(--apricot);transform:scale(1.06)}
.faces .who{display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;padding:6px 0 5px;flex:none;border:0;border-radius:18px;background:transparent;color:var(--ocean-ink-2);font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,color .2s}
.faces .who .face{width:44px;height:44px;font-size:19px;border:3px solid transparent}.faces .who span:last-child{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faces .who.on{background:rgba(0,10,20,.42);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}.faces .who.on .face{border-color:var(--apricot)}
.fdiv{display:block;width:40px;height:1px;background:rgba(230,242,247,.18);margin:4px auto}
.faces{gap:4px;padding-bottom:8px;margin-bottom:2px}
.kidnav svg{width:30px;height:30px}.kidnav{min-height:76px;font-size:14px}
.kidsolo{max-width:1100px}.kidsolo .kid{box-shadow:var(--shadow)}.kidsolo .ktiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.kidsolo .ktile{min-height:150px}.kidsolo .ktile .em{font-size:64px}.kidsolo .ktile .lb{font-size:19px}.kidsolo .kh h2{font-size:34px}
.face small{display:block}
.face{white-space:nowrap;line-height:1;overflow:hidden}
.face.two{font-size:16px;letter-spacing:-1px}
.face.lg.two{font-size:25px}
.face.lg{width:68px;height:68px;font-size:36px;flex:none}
.navbtn{flex:none;width:68px;min-height:52px;border:0;border-radius:18px;background:transparent;color:var(--ocean-ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;letter-spacing:.01em;transition:background .2s,color .2s}
.navbtn:hover{color:var(--ocean-ink)}
.navbtn.on{background:rgba(230,242,247,.13);color:#fff}
body.night .navbtn.on{color:var(--ocean-ink)}
.rail .grow{flex:1}
.syncdot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ocean-ink-2);border:0;background:none;padding:6px}
.syncdot i{width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid rgba(230,242,247,.5)}
.syncdot.warn i{background:var(--warn)}
.syncdot.bad i{background:var(--bad)}
main{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}

/* ---------- sky band (signature) ---------- */
.sky{position:relative;flex:none;height:clamp(230px,35vh,330px);color:#fff;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));transition:background 2s linear}
.sky::after{content:none}
.sky.dark{color:#E7ECF6}
.sky-head{position:absolute;inset:calc(18px + env(safe-area-inset-top)) var(--pad) auto var(--pad);display:flex;justify-content:space-between;align-items:flex-start;gap:20px;z-index:3}
.clock{font-size:clamp(64px,9.4vw,112px);font-weight:650;letter-spacing:-.035em;line-height:.92;text-shadow:0 2px 10px rgba(0,0,0,.14)}
.clock .ampm{font-size:.3em;font-weight:600;letter-spacing:0;margin-left:.15em;opacity:.85}
.date{font-size:clamp(18px,2vw,24px);font-weight:600;margin-top:8px;opacity:.95}
.allday{margin-top:6px;font-size:16px;font-weight:600;opacity:.9;display:flex;gap:8px;flex-wrap:wrap}
.allday span{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px}
.wx{text-align:right;display:flex;align-items:center;gap:12px}
.wx svg{width:56px;height:56px;stroke:#fff;stroke-width:1.6}
.wx .t{font-size:clamp(40px,5vw,60px);font-weight:650;letter-spacing:-.03em;line-height:1}
.wx .r{font-size:16px;font-weight:600;opacity:.92}
.horizon{position:absolute;left:var(--pad);right:var(--pad);bottom:16px;height:46%;z-index:2}
.horizon::before{content:"";position:absolute;left:calc(-1 * var(--pad));right:calc(-1 * var(--pad));bottom:-16px;height:41px;background:linear-gradient(180deg,rgba(18,108,143,.28),rgba(11,79,108,.5))}
body.night .horizon::before{background:linear-gradient(180deg,rgba(20,35,61,.6),rgba(8,16,30,.8))}
.horizon .line{position:absolute;left:0;right:0;bottom:24px;height:2px;background:rgba(255,255,255,.55);border-radius:2px}
.horizon .past{position:absolute;left:0;bottom:24px;height:2px;background:#fff;border-radius:2px}
.tick{position:absolute;bottom:0;font-size:13px;font-weight:600;transform:translateX(-50%);opacity:.85}
.tick::before{content:"";position:absolute;left:50%;bottom:20px;width:2px;height:8px;background:rgba(255,255,255,.55)}
.sun{position:absolute;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFF4D6,#FFD08A 55%,#F2A65A);z-index:1;transition:left 1s,bottom 1s}
.sun::before{content:"";position:absolute;inset:-46px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.5) 0%,rgba(255,200,130,.18) 40%,rgba(255,200,130,0) 70%);z-index:-1}
.sun.moon{background:radial-gradient(circle at 38% 36%,#F4F1E8,#D8D4C8 60%,#B9B5A9)}
.sun.moon::before{background:radial-gradient(circle,rgba(230,226,212,.22) 0%,rgba(230,226,212,0) 60%)}
.pill{position:absolute;bottom:34px;height:40px;max-width:30%;display:flex;align-items:center;gap:8px;padding:0 14px 0 6px;border-radius:99px;background:rgba(255,255,255,.92);color:var(--ink);font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px -8px rgba(0,0,0,.45);z-index:2;border:0;transition:opacity .4s}
.pill.r1{bottom:80px}
.stem{position:absolute;bottom:26px;width:2px;margin-left:-1px;background:rgba(255,255,255,.85);border-radius:2px;z-index:1}
body.night .stem{background:rgba(175,192,210,.5)}
.more-ev{position:absolute;right:0;top:-34px;font-size:14px;font-weight:700;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:99px}
body.night .pill{background:#1C2944;color:#C3CFDF;box-shadow:0 6px 18px -10px rgba(0,0,0,.6)}
body.night .sky{color:#E3E9F2}
body.night .sun{opacity:.8}
body.night .wx svg{stroke:#AFC0D2}
body.night .face{filter:saturate(.55) brightness(.72)}
body.night .mark{border-color:#8A9BB4}
.pill .dot{width:28px;height:28px;border-radius:50%;background:var(--c);flex:none;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.pill.done{opacity:.55}
.pill.now{box-shadow:0 0 0 3px var(--apricot),0 6px 18px -8px rgba(0,0,0,.45)}
.pill span{overflow:hidden;text-overflow:ellipsis}
.mark{position:absolute;bottom:18px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--c);border:3px solid #fff;z-index:2}
.mark.done{opacity:.5}
.mark.live{box-shadow:0 0 0 3px var(--apricot)}
.zone .items.scroll{-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent);padding-bottom:24px}
.sky.compact{height:auto;min-height:150px;padding-bottom:84px}
.sky.compact .sky-head{position:relative;inset:auto;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 0}
.sky.compact .clock{font-size:52px}
.sky.compact .wx svg{width:40px;height:40px}.sky.compact .wx .t{font-size:34px}
.sky.compact .horizon{left:var(--pad);right:var(--pad);height:70px;bottom:8px}
.sky.compact .pill{height:30px;font-size:13px;bottom:30px}.sky.compact .pill .dot{width:20px;height:20px}
.sky.compact .pill.r1{bottom:30px}
.sky.compact .sun{width:30px;height:30px;margin-left:-15px}

/* ---------- content ---------- */
.board{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:18px;padding:18px var(--pad) calc(22px + env(safe-area-inset-bottom));min-height:0;flex:1 0 auto}
.zone{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.zone h2{margin:0 0 12px;font-size:21px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.zone h2 .h2link{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:4px 0;font:inherit;color:inherit;cursor:pointer}
.zone h2 .h2link svg{width:18px;height:18px;color:var(--ink-3);transition:transform .15s}
.zone h2 .h2link:active svg{transform:translateX(3px)}
/* list switch: one bordered track, the active list is a raised filled thumb */
.seg.sm{margin-left:auto;box-shadow:none;padding:3px;gap:2px;border-radius:99px;background:color-mix(in srgb,var(--ocean-2) 6%,var(--surface));border:1.5px solid color-mix(in srgb,var(--ocean-2) 35%,transparent)}
.seg.sm button{display:inline-flex;align-items:center;white-space:nowrap;font-size:14.5px;padding:6px 11px;min-height:38px;border-radius:99px;transition:background .2s,color .2s,box-shadow .2s}
.seg.sm button.on{box-shadow:0 2px 6px -1px rgba(0,0,0,.25)}
.seg.sm .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.seg.sm button.on .n{background:rgba(255,255,255,.22)}
body.night .seg.sm{border-color:rgba(156,195,211,.35);background:rgba(255,255,255,.04)}
.zone h2 .more{margin-left:auto;font-size:15px;font-weight:600;color:var(--ocean-2);background:none;border:0;padding:6px 4px}
body.night .zone h2 .more{color:var(--ocean-ink)}
.quick-go{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.quick-go .btn{justify-content:center}
.invite-msg{padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--ocean-2) 7%,transparent);font-size:15.5px;line-height:1.5;user-select:text;-webkit-user-select:text}
.invite-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.invite-btns a.btn{text-decoration:none}
.setupcard{display:flex;align-items:center;gap:14px;margin:16px var(--pad) 0;padding:14px 18px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);border-left:5px solid var(--apricot)}
.setupcard>.grow,.sstep>.grow{flex:1;min-width:0}
@media (max-width:760px){.setupcard{flex-wrap:wrap}.setupcard>.grow{flex:1 1 calc(100% - 70px)}.setupcard .btn{flex:1;justify-content:center}}
.sc-ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--apricot) var(--p),color-mix(in srgb,var(--ink) 9%,transparent) 0);display:grid;place-items:center;flex:none}
.sc-ring b{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px}
.sstep{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.sstep.done .sdot{background:#4E9A3F;border-color:#4E9A3F;color:#fff}.sdot svg{width:16px;height:16px;stroke-width:3}
.sstep.done b{color:var(--ink-2)}
.tour{text-align:center;padding:8px 6px}
.tour .te{font-size:64px;line-height:1.2}
.tour h2{font-size:26px;margin:8px 0}
.tour p{font-size:17px;line-height:1.5;color:var(--ink-2);max-width:460px;margin:0 auto 14px}
.tdots{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tdots i.on{background:var(--ocean-2);width:22px;border-radius:99px}
.dkinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.dkind{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px;border:2px solid var(--line);border-radius:20px;background:var(--surface);font:inherit;color:var(--ink);text-align:center}
.dkind:active{border-color:var(--ocean-2)}
.dkind span{font-size:44px}.dkind b{font-size:18px}.dkind small{color:var(--ink-2);font-size:14px}
.planning{background:var(--ocean);color:#fff;gap:10px;cursor:default}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pblock{margin:0 0 14px}.pblock .kt{margin:0 0 8px}
.ptags{display:flex;flex-wrap:wrap;gap:8px}
.ptag{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font:inherit;font-weight:650;font-size:15px;color:var(--ink-2)}
.ptag.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.ptag:disabled{opacity:.35}
.stepper b{min-width:34px;text-align:center;font-size:22px}
.mbadges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.mb{font-size:12.5px;font-weight:750;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink-2)}
.mb.real{background:color-mix(in srgb,#4E9A3F 18%,transparent);color:#2E6B24}
.mb.est{background:color-mix(in srgb,var(--apricot) 26%,transparent);color:var(--apricot-ink)}
.mb.dbl{background:color-mix(in srgb,var(--ocean-2) 12%,transparent);color:var(--ocean-2)}
.ing li.ggrp{display:block;border:0;padding:14px 0 2px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.ing li small{color:var(--ink-3);font-weight:600}
.pchip.left{background:color-mix(in srgb,#8A6BC2 16%,transparent)}
.clearbtn{margin-left:6px;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--ink-3);text-transform:none;letter-spacing:0;padding:6px}
body.night .ptag{background:transparent}
.item .price{margin-left:auto;padding-left:10px;font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.item .price + .x{margin-left:6px}
.mweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.mday{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:178px;padding:14px;border:0;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);text-align:left;color:var(--ink);font:inherit}
.mday.today{outline:3px solid var(--apricot);outline-offset:-3px}
.mday.cooked{opacity:.6}
.mday.lunch{min-height:0;padding:12px;gap:4px}.mday.lunch .me{font-size:26px}.mday.lunch .mt{font-size:14.5px;font-weight:700}
.mday[data-slot]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;margin:0;opacity:.95;box-shadow:0 14px 34px rgba(14,40,60,.28);transition:none}
.drag-src{opacity:.35}.drop-on{outline:3px dashed var(--ocean-2);outline-offset:2px}
body.dragging{cursor:grabbing}body.dragging *{cursor:grabbing!important}
.dnd-hint{margin:8px 2px 0}
body.dragging[data-drag=lunch] .mday.lunch.empty{border:2px dashed color-mix(in srgb,var(--ocean-2) 35%,transparent);min-height:64px}
.mday.lunch{align-items:stretch;text-align:left}.mday.lunch .dn{font-size:12.5px;color:var(--muted)}
.lg{display:grid;gap:3px;padding:6px 0;border-top:1px solid rgba(0,0,0,.06)}.lg:first-of-type{border-top:0;padding-top:2px}
.lgw{display:flex;align-items:center;gap:6px;font-size:13px}.lgw .face{width:22px;height:22px;font-size:12px;flex:none}
.lge{font-size:20px;line-height:1.1;letter-spacing:1px;font-style:normal}.lge i{font-style:normal}
.lgm{font-size:13.5px;font-weight:650;line-height:1.25}.lgm small{color:var(--muted);font-weight:600}

.addbar .input{flex:1}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.panel h2{font-size:22px;margin:0 0 6px;font-weight:700}
.panel p.help{color:var(--ink-2);margin:0 0 16px;font-size:16.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:0;background:var(--surface);box-shadow:var(--shadow);padding:10px 16px;border-radius:99px;font-weight:700;font-size:16px;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.tab.on{background:var(--ocean);color:#fff}
.tab .n{background:rgba(255,255,255,.22);border-radius:99px;padding:0 8px;font-size:14px}
.tab:not(.on) .n{background:var(--line)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;background:var(--c);padding:0}
.sw.on{border-color:var(--ink)}
.toggle{position:relative;width:56px;height:32px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--ok)}.toggle.on::after{transform:translateX(24px)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:28px;letter-spacing:.2em;font-weight:700;background:var(--sand);color:var(--sand-ink);padding:8px 16px;border-radius:12px}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:6px 12px;border-radius:99px}
.status.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.status.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:#8A5E0A}
.status.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.steps{margin:0 0 14px;padding-left:22px;color:var(--ink-2);font-size:16.5px}
.steps li{margin:4px 0}

/* week / month */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px;min-height:calc(100vh - 170px);display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{box-shadow:0 0 0 3px var(--apricot),var(--shadow)}
.day .dh{font-weight:700;font-size:15px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline}
.day .dh b{font-size:26px;color:var(--ink);letter-spacing:-.02em}
.dwx{display:flex;align-items:center;gap:6px;margin:2px 0 8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.dwx svg{width:20px;height:20px;flex:none;color:var(--ink-2)}
.dwx b{color:var(--ink);font-weight:700}
.dwx .mm{margin-left:auto;color:var(--ocean-2);font-size:13px}
.wev{border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--c) 14%,var(--raise));font-size:15px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.wev .t{display:block;font-size:13px;font-weight:700;color:var(--ink-2)}
.wev.ad{background:var(--c);color:#fff}
.wev.ad .t{color:rgba(255,255,255,.85)}
.hol{font-size:13px;font-weight:700;color:var(--apricot-ink);background:color-mix(in srgb,var(--apricot) 25%,transparent);border-radius:10px;padding:5px 8px}
body.night .hol{color:var(--apricot)}
.band{display:grid;grid-template-columns:150px 1fr;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.band.live{box-shadow:0 0 0 3px var(--apricot),var(--shadow)}
.band-sky{color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:18px}
.band-sky svg{width:30px;height:30px;stroke-width:1.8}
body.night .band-sky{filter:brightness(.7) saturate(.8)}
.band-evs{padding:4px 20px;min-height:74px;display:flex;flex-direction:column;justify-content:center}
.free{color:var(--ink-3);font-weight:600;font-size:17px}
.evbtn{width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.wev{border:0;text-align:left;font-family:inherit;color:inherit;width:100%;cursor:pointer}
.wband{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-top:4px}
.day .dh{border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--ink-2);cursor:pointer;padding:0;width:100%}
.mc{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
@media (max-width:760px){.band{grid-template-columns:96px 1fr}.band-sky{padding:12px;font-size:15px}.band-evs{padding:4px 12px}}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{font-size:14px;font-weight:700;color:var(--ink-3);text-align:center;padding:4px 0}
.mc{background:var(--surface);border-radius:12px;min-height:96px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mc.out{opacity:.45}
.mc.today{box-shadow:0 0 0 3px var(--apricot)}
.mc .n{font-weight:750;font-size:16px}
.mc .e{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;display:flex;gap:5px;align-items:center}
.mc .e i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* focus view */
.focus{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;padding:18px var(--pad) 22px;flex:1;min-height:0}
.hero{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:30px 34px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;overflow:hidden}
.hero .lead{font-size:20px;font-weight:700;color:var(--ink-2)}
.hero .big{font-size:clamp(36px,4.6vw,58px);font-weight:750;letter-spacing:-.03em;line-height:1.05}
.hero .leave{display:inline-flex;align-items:baseline;gap:12px;margin-top:10px;font-size:clamp(26px,3vw,38px);font-weight:750;color:var(--apricot-ink)}
body.night .hero .leave{color:var(--apricot)}
.hero .leave .num{font-size:1.4em;letter-spacing:-.03em}
.hero .meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.hero .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--apricot),#E9875B);border-radius:99px;transition:width 1s}
.capture{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:99px;background:var(--apricot);color:#3D2208;font-weight:750;font-size:19px;padding:16px 24px 16px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 26px -10px rgba(0,0,0,.35)}
.capture svg{stroke-width:2.6}

/* sitter */
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.contact{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.contact .nm{font-size:22px;font-weight:750}
.contact .rl{color:var(--ink-2);font-weight:650}
.contact a{font-size:26px;font-weight:750;color:var(--ocean-2);text-decoration:none;letter-spacing:.01em}
.contact.emerg{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.contact.emerg a{color:var(--bad)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:none}
.overlay.on{display:block}
#night{background:#03060C;color:#7F8DA3;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#night.on{display:flex}
#night .clock{color:#55627A;text-shadow:none;font-size:clamp(80px,14vw,170px)}
#night .date{color:#3F4A5E}
#glance{background:linear-gradient(180deg,rgba(6,30,48,.08),rgba(6,30,48,.42)),linear-gradient(180deg,var(--g-top),var(--g-bot));color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:40px}
#glance.on{display:flex}
#glance .clock{font-size:clamp(110px,19vw,230px);text-shadow:0 2px 30px rgba(0,0,0,.18)}
#glance .date{font-size:clamp(24px,3vw,34px);font-weight:650;opacity:.92}
#glance .gwx{font-size:22px;font-weight:600;opacity:.85}
#glance .key{margin-top:22px;display:flex;align-items:center;gap:16px;padding:16px 26px;border-radius:24px;background:rgba(6,30,48,.26);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:26px;font-weight:700;max-width:90vw}
#glance .key .t{font-weight:800}
#glance .key .lbl2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
#glance .key i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.5);flex:none}
#glance .cds{margin-top:16px}
#glance .cd{font-size:22px;background:rgba(6,30,48,.24);display:inline-flex;align-items:center;gap:8px}
#glance .cd .b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
#glance .cd .b svg{width:18px;height:18px}
#glance .cd .b + .b{margin-left:-9px}
#saver{background:#000}
#saver .slide{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;opacity:0;transition:opacity 2.4s ease}
#saver .slide.on{opacity:1}
#saver .slide img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
/* photo shaped differently from the screen (e.g. portrait on a landscape tablet): show it whole, over a soft blurred copy */
#saver .slide.fit img.fg{object-fit:contain}
#saver .slide.fit img.bg{filter:blur(28px) brightness(.55);transform:scale(1.15)}
#saver .cap{position:absolute;left:32px;bottom:28px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6)}
#saver .cap .clock{font-size:72px}
.cds{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
#saver .cds{justify-content:flex-start}
.cd{padding:10px 18px;border-radius:99px;font-size:20px;font-weight:650;background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cd b{font-weight:800;margin-left:4px}
#night .cd{background:rgba(127,141,163,.1);color:#55627A}
.sheet-bg{position:fixed;inset:0;background:rgba(10,24,34,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out}
.sheet{background:var(--ground);width:min(640px,100%);border-radius:28px 28px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);animation:up .28s cubic-bezier(.2,.9,.2,1);max-height:90vh;overflow:auto}
@media(min-width:761px){.sheet-bg{align-items:center}.sheet{border-radius:28px}}
.sheet h2{margin:0 0 14px;font-size:24px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.update-bar{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:61;display:flex;align-items:center;gap:12px;padding:12px 20px 12px 16px;border:0;border-radius:99px;background:var(--apricot);color:#3B2410;font:inherit;font-size:16px;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);animation:up .3s ease-out;max-width:92vw}
.update-bar svg{width:20px;height:20px;flex:none}
.update-bar b{font-weight:800;margin-right:8px}
.update-bar span{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-weight:650;z-index:60;box-shadow:var(--shadow);max-width:90vw}

/* auth / onboarding */
.gate{min-height:100%;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#7FB6D8 0%,#CFE6F1 55%,var(--ground) 100%)}
.gate .card{width:min(460px,100%);background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:30px}
.gate h1{margin:0 0 6px;font-size:34px;letter-spacing:-.02em}
.gate p{color:var(--ink-2);margin:0 0 20px}
.gate .logo{width:64px;height:64px;border-radius:18px;margin-bottom:16px;background:linear-gradient(180deg,#5AA6D6,#F6D6B0);position:relative;overflow:hidden}
.gate .logo::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;left:19px;top:24px;background:radial-gradient(circle at 40% 38%,#FFF4D6,#FFD08A 55%,#F2A65A)}
.err{color:var(--bad);font-weight:650;margin:8px 0 0}

/* phone */
.tabbar{display:none}
@media (max-width:760px){
  body{font-size:17px}
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .tabbar{position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);box-shadow:0 -1px 0 var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:6px 0}
  .tabbar button.on{color:var(--ocean-2)}
  body.night .tabbar button.on{color:var(--apricot)}
  :root{--pad:16px}
  .board,.focus,.split{grid-template-columns:1fr;overflow:visible}
  main{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .board{flex:none}
  .zone{overflow:visible}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .week .day:not(.today):not(:has(.wev)){padding:6px 14px;gap:0;border-radius:14px}.week .day:not(.today):not(:has(.wev)) .dh{align-items:center}.week .day:not(.today):not(:has(.wev)) .dh b{font-size:19px;color:var(--ink-2)}
  .row>.grow{min-width:40px}
  .page h1{font-size:28px}
  .capture{bottom:calc(84px + env(safe-area-inset-bottom))}
  .mc{min-height:62px;padding:4px}.mc .e span{display:none}
}
/* Mid-size tablets (e.g. iPad 10.2" landscape): Up next and Notes stacked on the left, Lists runs the full height on the right; the page scrolls. */
@media (max-width:1100px) and (min-width:761px){
  main{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .board{grid-template-columns:1fr 1fr;grid-template-areas:"up lists" "notes lists";grid-template-rows:auto 1fr;flex:none;align-items:start}
  .board .up-z{grid-area:up}.board .lists-z{grid-area:lists;align-self:stretch}.board .notes-z{grid-area:notes}
  .board .zone{overflow:visible}
  .board .zone .notes{-webkit-mask-image:none;mask-image:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const STAPLES = /^(salt|pepper|black pepper|water|oil|olive oil|vegetable oil|cooking oil|sugar|flour|plain flour)$/i;
const normFood = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z ]/g, ' ').replace(/\b(fresh|large|small|medium|chopped|diced|sliced|minced|finely|to serve|optional|of|a|tin|can|cans|tins)\b/g, ' ').replace(/\s+/g, ' ').trim();
function haveIt(name) {
  const n = normFood(name); if (!n || STAPLES.test(n)) return true;
  return S.pantry.some(p => { const q = normFood(p.name); return q && (q === n || n.includes(q) || q.includes(n) || q.split(' ').pop() === n.split(' ').pop()); });
}
const placeGuess = n => /frozen|ice cream|ice block|peas|chips|nuggets/i.test(n) ? 'freezer' : /milk|cheese|yog|butter|cream|egg|chicken|mince|beef|pork|lamb|fish|salmon|ham|bacon|sausage|tofu|lettuce|spinach|berries|juice|dip/i.test(n) ? 'fridge' : 'pantry';
const recipeLink = t => 'https://www.recipetineats.com/?s=' + encodeURIComponent(t);
const lbox = () => Object.assign({staples: '', kids: {}}, kset().lunchbox || {});
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const kidDays = id => { const d = (lbox().kids[id] || {}).days; return Array.isArray(d) ? d : [1, 2, 3, 4, 5]; };
const kidsAtSchool = k => kids().filter(c => kidDays(c.id).includes(weekdayOfKey(k)));
const lunchKids = () => (kids().length ? kids() : [{id: 'k', name: 'Kids'}]).map(k => ({name: k.name, school_days: kidDays(k.id).map(d => WD[d]), likes: (lbox().kids[k.id] || {}).likes || '', wont_eat: (lbox().kids[k.id] || {}).nope || ''}));
const kset = () => Object.assign({prefs: '', servings: 4, budget: 0}, settings().kitchen || {});
function weekStart(off = 0) { const t = dayKey(new Date()); return addDaysKey(t, -((weekdayOfKey(t) + 6) % 7) + off * 7); }
const mealOn = (k, slot = 'dinner') => S.meals.find(m => m.day === k && (m.slot || 'dinner') === slot);
const schoolDay = k => weekdayOfKey(k) % 6 !== 0 && !WA_HOLIDAYS[k] && (!settings().school || WA_TERMS.some(([a, b]) => a <= k && k <= b));

function scanMoreSheet(refresh) {

/* photos */
async function uploadPhotos(files) {
  const me = meMember(); let n = 0; const album = (S.uploadAlbum || photoAlbums()[0] || 'Family').slice(0, 40);
  toast(`Uploading ${files.length} photo${files.length > 1 ? 's' : ''}…`);
  for (const file of files) {
    try {
      const blob = await shrink(file, 1920);
      const path = `${S.hid}/${uid()}.jpg`;
      const up = await sb.storage.from('photos').upload(path, blob, {contentType: 'image/jpeg'});
      if (up.error) throw up.error;
      const {data} = await sb.from('photos').insert({household_id: S.hid, path, album, uploaded_by: me ? me.id : null}).select().single();
      if (data && !S.photos.find(p => p.id === data.id)) S.photos.unshift(data); n++;
    } catch (err) { console.error(err); }
  }
  toast(n ? `${n} photo${n > 1 ? 's' : ''} added` : "Couldn't upload those photos."); render();
}
function shrink(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .85); URL.revokeObjectURL(img.src);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
function photoAlbums() { return [...new Set(S.photos.map(p => p.album || 'Family'))].sort(); }
async function loadThumbs() {
  const els = document.querySelectorAll('.thumbs'); if (!els.length || !S.photos.length) return;
  const {data} = await sb.storage.from('photos').createSignedUrls(S.photos.map(p => p.path), 600);
  const url = {}; (data || []).forEach((d, i) => { if (d.signedUrl) url[S.photos[i].id] = d.signedUrl; });
  els.forEach(el => { el.innerHTML = S.photos.filter(p => (p.album || 'Family') === el.dataset.album && url[p.id]).map(p => `<div style="position:relative"><img src="${esc(url[p.id])}" alt="" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block"><button class="icon-btn" style="position:absolute;right:6px;top:6px;width:38px;height:38px" data-act="del-photo" data-id="${p.id}" aria-label="Delete photo">${icon('trash')}</button></div>`).join(''); });
}
