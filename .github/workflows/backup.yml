name: Weekly encrypted backup
on:
  schedule:
    - cron: '43 18 * * 6'  # Sunday 2:43am Perth
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKUPS_ENABLED == 'true' }}
    steps:
      - name: Install Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          pg_dump "$DB_URL" --schema=public --data-only --no-owner -f skylike.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -c skylike.sql
          rm skylike.sql
      - uses: actions/upload-artifact@v4
        with:
          name: skylike-backup-${{ github.run_id }}
          path: skylike.sql.gpg
          retention-days: 60
